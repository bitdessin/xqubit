[project]
name = 'xqubit'
description = 'Quantum state vector representation for gene expression data'
authors = [
    { name = 'Jianqiang Sun', email = 'sun@bitdessin.dev' },
]
readme = 'README.md'
classifiers = [
        'Development Status :: 4 - Beta',
        'Environment :: Console',
        'Intended Audience :: Science/Research',
        'Programming Language :: Python :: 3',
        'Topic :: Scientific/Engineering :: Bio-Informatics',
]
license = {'text' = 'MIT'}
requires-python = '>=3.10'
dependencies = [
    'tqdm',
    'numpy>=1.21',
    'pandas>=1.3',
    'matplotlib',
    'scikit-learn',
    'igraph',
    'leidenalg',
    'plotly',
]
dynamic = ['version']

[project.urls]
Homepage = 'https://github.com/bitdessin/xqubit'
Issues = 'https://github.com/bitdessin/xqubit/issues'


[project.optional-dependencies]
full = [
    'qiskit',
    'qiskit_aer',
    'qiskit_ibm_runtime',
    'dimod',
    'dwave-neal',
]
docs = [
    'sphinx',
    'sphinx-rtd-theme',
    'sphinxcontrib-napoleon',
    'sphinx_autodoc_typehints',
    'furo',
]


[build-system]
requires = ['setuptools>=61.0', 'wheel']
build-backend = 'setuptools.build_meta'
